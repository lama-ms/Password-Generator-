<!DOCTYPE html>
    <meta charset="UTF-8">
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
        <title>Password Generator</title>
    </head>
    <body>
        <div class = "bigBox">

            <div class="top">
              <button onclick="changeButton()" id="modeButton"> ☀️ </button>
              <h1 id = "heading">Generate a <br> <span class="green-text"> random password </span> </h1>
              <h4 id="bodyText">Never use an insecure password again.</h4>
            </div>

            <div class="middle">
              <button onclick= "generatePass()" id="button"> Generate passwords </button>
              
              <div class="add-ons">
               <label id="password-len">
                  <span id="pass-length-text">Password length:</span>
                  <input type="number" id="passwordLength" min="4" max="22">
                  <span id="lengthError"></span>
               </label>


               <div class="toggles">
                
                <div class="toggle-box1">
                 <span> symbols</span>
                 <label  onclick="toggleChecked()" class="toggle" >
                  <input type="checkbox" id="symbols">
                  <span class="toggle-button"></span>
                 </label>
                </div>
               
                <div class="toggle-box2">
                 <span> numbers </span>
                 <label  onclick="toggleChecked()" class="toggle" >
                  <input type="checkbox" id="numbers">
                  <span class="toggle-button"> </span>
                 </label>
                </div>

               </div>

              </div> 
            </div>

            <div class="bottom">
                
             <hr class="line">  

             <div class="passwords">

              <div class="password-container">
        
               <div class="passwordBox" id = "passwordBox1">
                <span id="passwordText1"></span>
                <img src="copy.png" class="image" onclick="copyPassword(passwordText1, this)"> 
               </div>
              </div>

              <div class="password-container">
               <div class="passwordBox" id="passwordBox2">
                <span id="passwordText2"></span>
                <img  src="copy.png" class="image"  onclick="copyPassword(passwordText2, this)">
               </div>

              </div>

    
    
            </div>
    
        </div>
        <script src="index.js"></script>
    </body>
</html>
